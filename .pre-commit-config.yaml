exclude: |
  (?x)(
    ^CHANGELOG\.md$
  )

repos:

- repo: local
  hooks:
    # Check for Jupyter Notebook outputs
  - id: check-notebooks
    name: Check Jupyter Notebook Outputs
    entry: python .hooks/check_notebook_outputs.py
    language: python
    types: [jupyter]
    pass_filenames: true

- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
    # Check for large files
  - id: check-added-large-files
    name: Check for files larger than 10 MB
    args: [--maxkb=10000]

    # Add end of file blank line
  - id: end-of-file-fixer
    name: Ensures blank line at the end of scripts

    # Remove trailing whitespace
  - id: trailing-whitespace
    name: Check for trailing whitespaces (auto-fixes)

    # Format JSON
  - id: pretty-format-json
    name: Formats json files
    args: [--indent, '2', --no-sort-keys, --autofix]
    files: \.json$

    # Validate YAML
  - id: check-yaml

- repo: https://github.com/macisamuele/language-formatters-pre-commit-hooks
  rev: v2.12.0
  hooks:
    # Format YAML
  - id: pretty-format-yaml
    args: [--autofix, --indent, '2']
    files: \.ya?ml$

- repo: https://github.com/PyCQA/docformatter
  rev: v1.7.6
  hooks:
  # Wrap docstrings
  - id: docformatter
    language: python
    args: [--wrap-summaries=88, --wrap-descriptions=88, --in-place]

- repo: https://github.com/psf/black
  rev: 25.11.0
  hooks:
  - id: black
    args: [--line-length=88, --fast, --preview]


- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.14.5
  hooks:
  - id: ruff
    args: ['--select=E,F,W,C90,B,B9,I', '--ignore=E501,B006,C901', --extend-fixable=B007, --fix]
